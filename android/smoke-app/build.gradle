plugins { id 'com.android.application' }
android {
    namespace 'io.maddb.smoke'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'io.maddb.smoke'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview.1'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
}
// Consume the actual versioned AAR, not the library source module.
dependencies { implementation files(rootProject.file('maddb/build/versioned/maddb-android-0.1.0-preview.1-arm64-v8a.aar')) }
